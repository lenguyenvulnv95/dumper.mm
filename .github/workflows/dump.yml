name: Run Il2CppDumper
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install gdown & Download files from Drive
        run: |
          pip install -q gdown
          gdown "https://drive.google.com/file/d/1hRYIf3lnvmAtggOpN8ooeHM8wCVTE0D9/view?usp=drivesdk" -O UnityFramework
          gdown "https://drive.google.com/file/d/1bSwoFqozF1PGhEdfyKzUxsW8n2TY9AXc/view?usp=drivesdk" -O global-metadata.dat

      - name: Download & Execute Il2CppDumper
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
          unzip -q Il2CppDumper-net6-v6.7.46.zip -d dumper
          sed -i 's/"RequireAnyKey": true/"RequireAnyKey": false/' dumper/config.json
          mkdir -p output
          dotnet dumper/Il2CppDumper.dll UnityFramework global-metadata.dat output/

      - name: Extract ESP Offsets
        run: |
          echo "=== 1. CAMERA ==="
          grep -n -A 45 "public sealed class Camera :" output/dump.cs | grep -E "get_main|WorldToScreenPoint|RVA" || true

          echo "=== 2. LACTORROOT / ACTOR ==="
          grep -n -A 80 "class LActorRoot" output/dump.cs | grep -E "location|TheActorMeta|ValueComponent|Visible|RVA|0x" || true

          echo "=== 3. GAMEOBJMGR ==="
          grep -n -A 60 "class GameObjMgr" output/dump.cs | grep -E "HeroActors|AllActors|Update|0x|RVA" || true

          echo "=== 4. VALUECOMPONENT (HP) ==="
          grep -n -A 50 "class ValueComponent" output/dump.cs | grep -E "actorHp|actorHpTotal|get_actorHp|0x|RVA" || true
