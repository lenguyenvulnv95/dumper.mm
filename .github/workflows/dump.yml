name: Run Il2CppDumper
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install gdown & Download files from Drive
        run: |
          pip install -q gdown
          gdown "https://drive.google.com/file/d/1hRYIf3lnvmAtggOpN8ooeHM8wCVTE0D9/view?usp=drivesdk" -O UnityFramework
          gdown "https://drive.google.com/file/d/1bSwoFqozF1PGhEdfyKzUxsW8n2TY9AXc/view?usp=drivesdk" -O global-metadata.dat

      - name: Download & Execute Il2CppDumper
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
          unzip -q Il2CppDumper-net6-v6.7.46.zip -d dumper
          sed -i 's/"RequireAnyKey": true/"RequireAnyKey": false/' dumper/config.json
          mkdir -p output
          dotnet dumper/Il2CppDumper.dll UnityFramework global-metadata.dat output/

      - name: Extract ESP Offsets
        run: |
          echo "=== 1. CAMERA ==="
          grep -n -B 2 -A 1 "public static Camera get_main()" output/dump.cs || true
          grep -n -B 2 -A 1 "public Vector3 WorldToScreenPoint(Vector3 position)" output/dump.cs || true

          echo "=== 2. ACTORMETA ==="
          grep -n -A 25 "struct ActorMeta" output/dump.cs || grep -n -A 25 "class ActorMeta" output/dump.cs || true

          echo "=== 3. VALUEPROPERTYCOMPONENT (HP) ==="
          grep -n -A 60 "class ValuePropertyComponent" output/dump.cs | grep -E "Hp|hp|0x|RVA" | head -n 40 || true

          echo "=== 4. HERO LIST & MANAGER ==="
          grep -n -B 5 -A 5 "HeroActors" output/dump.cs | head -n 40 || true
          grep -n -B 2 -A 1 "public void UpdateLogic(" output/dump.cs | head -n 20 || true
