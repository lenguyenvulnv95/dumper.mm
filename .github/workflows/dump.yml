name: Run Il2CppDumper
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install gdown & Download files from Drive
        run: |
          pip install -q gdown
          gdown "https://drive.google.com/file/d/1hRYIf3lnvmAtggOpN8ooeHM8wCVTE0D9/view?usp=drivesdk" -O UnityFramework
          gdown "https://drive.google.com/file/d/1bSwoFqozF1PGhEdfyKzUxsW8n2TY9AXc/view?usp=drivesdk" -O global-metadata.dat

      - name: Download & Execute Il2CppDumper
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip
          unzip -q Il2CppDumper-net6-v6.7.46.zip -d dumper
          sed -i 's/"RequireAnyKey": true/"RequireAnyKey": false/' dumper/config.json
          mkdir -p output
          dotnet dumper/Il2CppDumper.dll UnityFramework global-metadata.dat output/

      - name: Extract Final RVAs
        run: |
          echo "=== 1. HP GETTERS ==="
          grep -n -B 2 -A 1 "public int get_actorHp()" output/dump.cs | head -n 12 || true
          grep -n -B 2 -A 1 "public int get_actorHpTotal()" output/dump.cs | head -n 12 || true

          echo "=== 2. ACTORMANAGER INSTANCE ==="
          grep -n -B 5 -A 10 "class ActorManager" output/dump.cs | head -n 25 || true
          grep -n -B 2 -A 1 "GetInstance()" output/dump.cs | grep -i -C 2 "ActorManager" || true

          echo "=== 3. ACTORLINKER FIELDS ==="
          grep -n -A 45 "public class ActorLinker" output/dump.cs | grep -E "0x|ActorCamp|ActorMeta|ValueComponent|position|Position|LActorRoot" | head -n 30 || true
          grep -n -B 2 -A 1 "public Vector3 get_position()" output/dump.cs | head -n 12 || true
