name: Build MetaDump Dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dylib for iOS arm64
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot $SDK_PATH -miphoneos-version-min=14.0 -dynamiclib -std=c++17 -framework Foundation dumper.mm -o MetaDump.dylib
          ldid -S MetaDump.dylib || codesign -f -s - MetaDump.dylib

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: MetaDump-dylib
          path: MetaDump.dylib
